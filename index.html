<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساحل هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#EAF6F8;--mut:#A9C9CF;--glass:rgba(255,255,255,.09);--gb:rgba(255,255,255,.18);--aqua:#2FD6CC;--sand:#F2D8A0}
html[data-t="1"]{--b1:#050B16;--b2:#0B2147;--b3:#143E86}html[data-t="2"]{--b1:#3B0F1C;--b2:#9B2D3A;--b3:#F08A4B}html[data-t="3"]{--b1:#052E1A;--b2:#14633A;--b3:#3BA66B}
html[data-t="4"]{--b1:#0E0A24;--b2:#2B1B6B;--b3:#6A4CE0}html[data-t="5"]{--b1:#0B0C0E;--b2:#1F2125;--b3:#4A4331}.hint{margin:14px 0 0;color:var(--mut);font-size:12px}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(165deg,var(--b1,#052B35) 0%,var(--b2,#0A5666) 48%,var(--b3,#12898F) 100%) fixed;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
.g1{width:420px;height:420px;background:#17B8B0;top:-120px;left:-100px}.g2{width:380px;height:380px;background:#2B7BD6;bottom:-140px;right:-100px}
@media(prefers-reduced-motion:no-preference){.g1{animation:fl 14s ease-in-out infinite alternate}.g2{animation:fl 18s ease-in-out infinite alternate-reverse}}
@keyframes fl{to{transform:translate(40px,30px)}}
.wave{position:fixed;left:0;right:0;bottom:0;height:120px;opacity:.12;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:34px 18px 120px}
.hero{text-align:center;padding:26px 0 8px}
.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,#17B8B0,#0F7C8C);display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
h1{margin:0;font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:-.5px}
.tag{margin:10px auto 0;max-width:620px;color:var(--mut);font-size:clamp(14px,2.4vw,17px);line-height:2}
.proj{display:inline-block;margin-top:12px;padding:3px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--gb);font-size:12.5px;color:var(--sand)}
.bar{margin:26px auto 0;max-width:680px;display:flex;gap:8px;background:var(--glass);border:1px solid var(--gb);border-radius:20px;padding:8px;backdrop-filter:blur(14px)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:16px Vazirmatn,Tahoma;padding:10px 14px}.bar input::placeholder{color:#9DC3C9}
.bar button{border:0;border-radius:14px;padding:0 24px;font:800 15px Vazirmatn,Tahoma;color:#052B35;background:linear-gradient(135deg,#7DF3E8,#2FD6CC);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button,.ex button{border:1px solid var(--gb);background:var(--glass);color:var(--ink);border-radius:18px;padding:6px 14px;font:600 12.5px Vazirmatn,Tahoma;cursor:pointer}
.chips button:hover,.ex button:hover{background:rgba(47,214,204,.22);border-color:var(--aqua)}
h2{font-size:18px;margin:44px 0 14px;font-weight:800;display:flex;align-items:center;gap:10px}h2:after{content:"";flex:1;height:1px;background:var(--gb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--glass);border:1px solid var(--gb);border-radius:20px;padding:16px;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:8px}
.card .gr{font-size:11.5px;color:var(--aqua);font-weight:600}.card b{font-size:15px}.card p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.sk{height:150px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 70%);background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){.sk{animation:sh 1.4s infinite}}@keyframes sh{to{background-position:-200% 0}}
.ad{position:relative;background:linear-gradient(135deg,rgba(242,216,160,.16),rgba(47,214,204,.12));border-color:rgba(242,216,160,.45)}
.ad i{position:absolute;top:12px;left:14px;font-style:normal;font-size:10.5px;color:var(--sand);border:1px solid rgba(242,216,160,.5);border-radius:10px;padding:0 8px}
.ad a{align-self:flex-start;margin-top:auto;text-decoration:none;color:#052B35;background:var(--sand);border-radius:12px;padding:6px 16px;font-weight:800;font-size:12.5px}
footer{margin-top:54px;text-align:center}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.soc a{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--gb);color:#fff;transition:.2s}
.soc a:hover{transform:translateY(-3px);background:rgba(47,214,204,.28)}
.fl{margin-top:16px;color:var(--mut);font-size:12.5px;line-height:2}.fl a{color:var(--sand);text-decoration:none;font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
#sai{--bg:#F3F7F9;--card:#fff;--ink:#0F2A33;--mut:#5C7882;--bd:#DAE6EB;--deep:#08424F;--sea:#0F7C8C;--aqua:#17B8B0;--deb:#0A8A97;--cre:#C98412;--pos:#168A5F;--neg:#CF3F55;--sh:0 18px 50px rgba(8,66,79,.30);

  background:linear-gradient(135deg,var(--deep),var(--sea));color:#fff;border-radius:30px;padding:12px 20px 12px 16px;font:800 14px Vazirmatn,Tahoma;box-shadow:var(--sh)}

  display:none;flex-direction:column;background:var(--bg);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}

#sai-h:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
#sai-h .t{flex:1;min-width:0}#sai-h b{font-size:16px;font-weight:800;display:block}

.rc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;width:100%}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.k{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--tone) 11%,var(--card));border:1px solid color-mix(in srgb,var(--tone) 28%,transparent)}

.k strong{display:block;font-size:17px;font-weight:800;color:var(--tone);font-variant-numeric:tabular-nums;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tw{overflow:auto;max-height:300px;border-radius:12px;border:1px solid var(--bd)}

.tw th{position:sticky;top:0;background:var(--deep);color:#fff;font-weight:600;padding:9px 12px;text-align:right}
.tw td{padding:8px 12px;border-bottom:1px solid var(--bd)}
.tw tr:nth-child(even) td{background:color-mix(in srgb,var(--bd) 30%,transparent)}
.tw tr:hover td{background:color-mix(in srgb,var(--aqua) 14%,transparent)}
.tw td.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;font-weight:600}
.tw td.d{color:var(--deb)}.tw td.c{color:var(--cre)}.tw td.neg{color:var(--neg)}.tw .z{opacity:.35}
.tw tr:last-child td{border-bottom:0}
.ch svg{max-width:none;overflow:visible}.ch .sc{overflow-x:auto}
.lg{display:flex;gap:14px;font-size:11.5px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

#sai-c button:hover{border-color:var(--sea);color:var(--sea)}
#sai-f{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--bd)}
#sai-q{flex:1;border:1px solid var(--bd);border-radius:14px;padding:11px 14px;font:14px Vazirmatn,Tahoma;background:var(--bg);color:var(--ink)}
#sai-s{border:0;background:linear-gradient(135deg,var(--aqua),var(--sea));color:#fff;border-radius:14px;width:46px;cursor:pointer;display:grid;place-items:center}
#sai-s svg{transform:scaleX(-1)}
.fb{padding:8px 12px 10px;background:var(--card);text-align:center;font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.fb a{color:var(--sea);text-decoration:none;font-weight:600}
.sai-hl{outline:3px solid var(--aqua)!important;outline-offset:3px;animation:saip 1s 3}
@keyframes saip{50%{outline-color:transparent}}
@media(max-width:600px){#sai-box,#sai-box.big{left:0;right:0;bottom:0;width:100%;height:92vh;border-radius:22px 22px 0 0}}
@media(prefers-reduced-motion:reduce){.sai-hl,.dots i{animation:none}#sai-m{scroll-behavior:auto}}
.pb{display:inline-block;width:72px;height:7px;border-radius:5px;background:var(--bd);overflow:hidden;vertical-align:middle}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--sea));border-radius:5px}.pv{margin-right:8px;font-weight:600;font-variant-numeric:tabular-nums}
.hp{gap:12px}.hg h4{margin:0 0 8px;font-size:13px;color:var(--sea)}.hi{padding:10px 12px;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px}
.hi b{font-size:13px}.hi p{margin:4px 0 8px;font-size:12px;color:var(--mut);line-height:1.8}.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{border:1px solid var(--bd);background:color-mix(in srgb,var(--sea) 8%,transparent);color:var(--ink);border-radius:16px;padding:4px 11px;font:600 11.5px Vazirmatn,Tahoma;cursor:pointer}
.ex button:hover{border-color:var(--sea);color:var(--sea)}
#sai-sg{display:none;position:absolute;left:14px;right:14px;bottom:130px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;z-index:5}

#sai-sg button:last-child{border-bottom:0}#sai-sg button:hover{background:color-mix(in srgb,var(--aqua) 14%,transparent)}#sai-sg small{color:var(--sea);font-weight:600;white-space:nowrap}
.tw th{cursor:pointer;user-select:none}.tw th:hover{background:var(--sea)}.tw tr.tot td{font-weight:800;background:color-mix(in srgb,var(--sea) 16%,var(--card))!important;border-top:2px solid var(--sea)}
.xo{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 4px;font-size:12.5px}.xo label{display:flex;align-items:center;gap:6px}.xo select{font:600 12.5px Vazirmatn,Tahoma;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.mut{color:var(--mut);font-size:11.5px;margin-top:8px}
html[data-t="1"] #sai{--bg:#0A1424;--card:#101D33;--ink:#E6EEF9;--mut:#8FA3C0;--bd:#1F3354;--deep:#0B2A55;--sea:#2F7BEA;--aqua:#35C4F0;--deb:#4DD0E1;--cre:#F2B84B;--pos:#3DD69B;--neg:#FF6B81;--sh:0 18px 50px rgba(0,0,0,.6)}

html[data-t="3"] #sai{--bg:#F1F7F2;--card:#fff;--ink:#12261A;--mut:#5B7A66;--bd:#D3E4D8;--deep:#14532D;--sea:#1F8A4C;--aqua:#3DBE7A;--deb:#0F7B6C;--cre:#B7791F;--pos:#15803D;--neg:#C2410C;--sh:0 18px 50px rgba(20,83,45,.3)}

html[data-t="5"] #sai{--bg:#121315;--card:#1C1E21;--ink:#F1EFE8;--mut:#A4A094;--bd:#34363B;--deep:#26282C;--sea:#B8913A;--aqua:#E5C06A;--deb:#7FD1C7;--cre:#E5B454;--pos:#6FCF97;--neg:#F27F7F;--sh:0 18px 50px rgba(0,0,0,.6)}
.bd{display:inline-block;border-radius:20px;padding:1px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}

.ib.on{background:var(--aqua);color:#052B35}

<body>

<div class="glow g1"></div><div class="glow g2"></div>
<svg class="wave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#fff" d="M0 60c150-50 300 50 450 0s300-50 450 0 220 30 300 0v60H0z"/></svg>
<main class="wrap">
  <section class="hero">
    <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M7 9a5 5 0 0 1 10 0"/></svg></div>
    <h1 id="bn">ساحل هوشمند</h1><p class="tag" id="bt"></p><span class="proj" id="bp" hidden></span>

 'area'), am: c(h, 'camt'), rg: c(h, 'reg'), ct: c(h, 'ctype') };\n    if (role === 'costs' && c(h, 'proj') > -1 && c(h, 'amt') > -1 && c(h, 'debit') \u003c 0)\n      res = { sh: s, p: c(h, 'proj'), a: c(h, 'amt'), dt: c(h, 'date'), ex: c(h, 'exp'), pt: c(h, 'pet'), ac: c(h, 'acc'), ds: c(h, 'desc') };\n    return !!res;\n  });\n  return (SAHEL.memo[role] = res);\n}\nfunction sahelHave_(need) {\n  if (!need) return true;\n  if (need === 'kardex') return sahelSheets_().some(function (s) { return sahelCol_(s.head, 'item') > -1 && sahelCol_(s.head, 'qty') > -1 && sahelCol_(s.head, 'debit') \u003c 0; });\n  return !!sahelRole_(need);\n}\nfunction sahelLv_(nq, D) {\n  var lv = /دفتر کل|دفاتر کل/.test(nq) ? 'kol' : /معین/.test(nq) ? 'moin' : null;\n  if (lv) { var ci = sahelCol_(D.sh.head, lv); if (ci > -1) return Object.assign({}, D, { p: ci }); }\n  return D;\n}\nvar SAHEL_COSTW_ = /هزینه|تنخواه|پروژه|ستد/;\n\n\n/* ─── هزینهٔ پروژه و تنخواه ─── */\nfunction sahelRows_(C, rg, f) { return C.sh.rows.filter(function (r) { return (!rg || C.dt \u003c 0 || sahelInRange_(r[C.dt], rg)) && (!f || f(r)); }); }\nfunction sahelSum_(rows, i) { return rows.reduce(function (a, r) { return a + sahelNum_(r[i]); }, 0); }\nfunction sahelGroup_(rows, ki, ai, top) {\n  var m = {}; rows.forEach(function (r) { var k = String(ki > -1 ? r[ki] : '').trim() || '—'; m[k] = m[k] || { n: 0, v: 0 }; m[k].n++; m[k].v += sahelNum_(r[ai]); });\n  return Object.keys(m).map(function (k) { return { k: k, n: m[k].n, v: m[k].v }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, top || 12);\n}\nfunction sahelBest_(toks, rows, idx) {\n  if (idx \u003c 0 || !toks.length) return null;\n  var seen = {}, best = null;\n  rows.forEach(function (r) {\n    var n = r[idx]; if (!n || seen[n]) return; seen[n] = 1;\n    var nn = sahelNorm_(n), sc = 0; toks.forEach(function (t) { if (/^\\d+$/.test(t) ? (' ' + nn + ' ').indexOf(' ' + t + ' ') > -1 : nn.indexOf(t) > -1) sc++; });\n    if (sc && (!best || sc > best.sc)) [0, 0]; by[p][0] += d; by[p][1] += c; });\n    Object.keys(by).slice(0, 25).forEach(function (p) { var s = sahelStatement_(sahelNorm_(p).split(' '), L), f = s && s.found[0]; t('صورت‌حساب ' + p, !!f && f.totals['بدهکار'] === by[p][0] && f.totals['بستانکار'] === by[p][1], f ? 'اختلاف' : 'پیدا نشد'); });\n    var tr = sahelTrial_('تراز', L).found[0].totals;\n    t('تراز اشخاص با جمع کل می‌خواند', Math.abs((tr['مانده بدهکار'] - tr['مانده بستانکار']) - (sd - sc)) \u003c 1, 'اختلاف');\n  }\n  if (C) t('جمع پروژه‌ها = جمع کل هزینه‌ها', Math.abs(sahelGroup_(C.sh.rows, C.p, C.a, 1e6).reduce(function (a, x) { return a + x.v; }, 0) - sahelSum_(C.sh.rows, C.a)) \u003c 1, 'اختلاف');\n  t('نرمال‌سازی ارقام و ی/ک', sahelNorm_('۲۵۱۴ كريم') === '2514 کریم', sahelNorm_('۲۵۱۴ كريم'));\n  return { text: 'تست دقت: ' + ok + ' درست، ' + bad + ' ناموفق.', found: [{ sheet: 'نتیجهٔ تست دقت', head: ['آزمون', 'نتیجه'], count: rows.length, rows: rows.slice(0, 40), totals: {} }] };\n}\n\n/* ═══ ثبت دستورها: تنها منبع حقیقت؛ مسیریاب و راهنما هر دو از همین فهرست ساخته می‌شوند ═══\n * برای افزودن دستور جدید یک آیتم به SAHEL_CMDS اضافه کن: { id, group, title, desc, ex:[مثال‌ها], need, test:/regex/, run:function(nq,toks,rg,cx){} }\n * need: 'ledger' | 'vessels' | 'costs' | 'kardex' | بدون need = همیشه فعال. راهنما خودکار به‌روز می‌شود. */\nvar SAHEL_CMDS = [\n  { id: 'help', group: 'عمومی', title: 'راهنمای دستورها', desc: 'فهرست همهٔ دستورهای فعال برای شیت‌های متصل. بعد از «راهنما» یک کلمه بنویس تا فقط همان بخش را ببینی.', ex: ['راهنما', 'راهنما شناور', 'راهنما هزینه'],\n    test: /راهنما|دستورات|دستور ها|\\bhelp\\b/, run: function (nq) { return sahelHelp_(nq); } },\n  { id: 'datetime', group: 'عمومی', title: 'تاریخ و ساعت', desc: 'تاریخ شمسی و ساعت تهران.', ex: ['تاریخ و ساعت'],\n    test: /ساعت چند|چندمه|چه روزی|تاریخ امروز|تاریخ و ساعت|الان چه/, run: function () { var j = sahelJalali_(new Date()); return { text: 'امروز ' + j.text + '، ساعت ' + j.time + ' (به وقت تهران).', found: [] }; } },\n  { id: 'refresh', group: 'عمومی', title: 'بروزرسانی داده', desc: 'داده‌ها را دوباره از گوگل‌شیت می‌خواند. اگر شیت را تازه تغییر داده‌ای بزن.', ex: ['بروزرسانی داده'],\n    test: /بروزرسانی|به روزرسانی|ریفرش|داده جدید/, run: function () { return { text: 'در حال بروزرسانی داده‌ها از شیت…', found: [], refresh: true }; } },\n  { id: 'diagnose', group: 'عمومی', title: 'تشخیص ستون‌ها', desc: 'نشان می‌دهد هر شیت چه نقشی گرفته و کدام ستون‌ها شناسایی شده‌اند.', ex: ['تشخیص ستون‌ها'],\n    test: /تشخیص ستون|ستون ها/, run: function () { return sahelDiagnose_(); } },\n  { id: 'selftest', group: 'عمومی', title: 'تست دقت', desc: 'جمع‌های گزارش‌ها را با یک محاسبهٔ مستقل از خود شیت مقایسه می‌کند.', ex: ['تست دقت'],\n    test: /تست دقت|بررسی دقت/, run: function () { return sahelSelfTest_(); } },\n\n  { id: 'scope', group: 'عمومی', title: 'محدود کردن به یک شیت', desc: 'اسم شیت را داخل سؤال بنویس تا فقط از همان شیت جواب بدهم. اگر فقط اسم شیت را بنویسی، خلاصه و چند ردیف اولش را می‌بینی.',\n    exFn: function () { return sahelSheets_().slice(0, 3).map(function (s, i) { return i === 1 ? s.title + ' علی' : s.title; }); }, ex: ['x'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'export', group: 'عمومی', title: 'ذخیره PDF و چاپ جدول', desc: 'بعد از هر گزارش بگو «پی دی اف» یا دکمهٔ PDF بالای جدول را بزن: کاغذ A4 یا A5، عمودی یا افقی. در پنجرهٔ باز‌شده Save as PDF یا چاپ را انتخاب کن.',\n    ex: ['پی دی اف', 'چاپ جدول'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'brain', group: 'عمومی', title: 'ادامهٔ گفتگو و یادگیری', desc: 'بعد از یک گزارش می‌توانی فقط بنویسی «مهر ماه» یا «نمودارش». نام‌های مشابه را پیشنهاد می‌کنم و انتخاب‌هایت را برای دفعهٔ بعد یاد می‌گیرم.',\n    ex: ['حساب علی', 'نمودارش', 'ماه قبل'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'vessel', group: 'شناورها', title: 'مشخصات یا فهرست شناورها', need: 'vessels',\n    desc: 'نام مالک یا شمارهٔ ثبت موقت → کارت کامل شناور همراه بدهکاری، بستانکاری و مانده همان مالک در دفتر حسابداری. بدون نام → فهرست با فیلتر پیشرفت، بازهٔ تاریخ قرارداد، جمع قراردادها و نمودار.',\n    ex: ['شناور رضا', 'شماره ثبت 1234', 'پیشرفت شناورها', 'شناورهای تکمیل نشده', 'شناورهای بالای 50 درصد', 'قراردادهای این ماه', 'بدهکاری و بستانکاری شماره ثبت 1234'],\n    test: /شناور|مالک|ثبت موقت|شماره ثبت|متراژ|تماس|پیشرفت|قرارداد|تکمیل|آدرس/, run: function (nq, toks, rg, cx) { return sahelVessel_(nq, toks, rg, cx.V); } },\n\n  { id: 'costs', group: 'هزینهٔ پروژه و تنخواه', title: 'هزینهٔ پروژه، تنخواه و دسته‌بندی', need: 'costs',\n    desc: 'با نام پروژه یا تنخواه: ریز اسناد و تفکیک عنوان هزینه. بدون نام: مقایسهٔ پروژه‌ها، تنخواه‌ها یا دسته‌ها؛ با «بزرگ‌ترین» ده هزینهٔ بزرگ؛ با «نمودار» روند ماهانه. همه با بازهٔ تاریخ کار می‌کنند؛ می‌توانی دریافت‌کننده یا کلیدواژه هم بگویی (مثلاً «به علی احمدی» یا «میلگرد») و آخر هر جدول «جمع کل» هست.',\n    ex: ['هزینه پروژه‌ها', 'هزینه پروژه الف', 'تنخواه‌ها', 'تنخواه علی این ماه', 'هزینه بر اساس عنوان هزینه', 'بزرگ‌ترین هزینه‌ها', 'نمودار هزینه ماهانه', 'پروژه 51 مریم به علی احمدی چقدر واریز کردیم', 'پروژه 51 مریم چقدر برای خرید میلگرد هزینه کردیم'],\n    test: SAHEL_COSTW_, run: function (nq, toks, rg, cx) { return sahelCostReport_(nq, toks, rg, cx.C); } },\n\n  { id: 'pnl', group: 'گزارش مالی', title: 'سود و زیان و مالیات', need: 'ledger', desc: 'درآمد و هزینه از روی نام «دفتر کل»؛ با بازه هم کار می‌کند. «مالیات» با taxRate تنظیم‌شده محاسبه می‌شود.',\n    ex: ['سود و زیان', 'سود و زیان مهر', 'مالیات امسال'], test: /سود|زیان|مالیات/, run: function (nq, toks, rg, cx) { return sahelPnl_(nq, cx.L, rg, /مالیات/.test(nq)); } },\n  { id: 'aging', group: 'گزارش مالی', title: 'معوقات (سن مانده اشخاص)', need: 'ledger', desc: 'مانده هر شخص بر اساس سن اسناد: تا ۳۰، ۳۱ تا ۶۰، ۶۱ تا ۹۰ و بیش از ۹۰ روز.',\n    ex: ['معوقات'], test: /معوق|سن بدهی|سررسید/, run: function (nq, toks, rg, cx) { return sahelAging_(cx.L); } },\n  { id: 'compare', group: 'گزارش مالی', title: 'مقایسهٔ ماه با ماه قبل', need: 'ledger', desc: 'بدهکار، بستانکار و تعداد سند این ماه در مقابل ماه قبل، با درصد تغییر.',\n    ex: ['مقایسه ماه'], test: function (nq) { return /مقایسه/.test(nq) && !SAHEL_COSTW_.test(nq); }, run: function (nq, toks, rg, cx) { return sahelCompare_(cx.L); } },\n  { id: 'chart', group: 'گزارش مالی', title: 'نمودار روند و اشخاص', need: 'ledger', desc: 'نمودار ماهانهٔ بدهکار و بستانکار؛ با نام شخص یا بازه محدودش کن. «نمودار اشخاص» مانده ۸ شخص اول را نشان می‌دهد.',\n    ex: ['نمودار روند', 'نمودار علی', 'نمودار اشخاص', 'نمودار روند مهر'], test: function (nq) { return /نمودار|چارت|روند/.test(nq) && !SAHEL_COSTW_.test(nq); }, run: function (nq, toks, rg, cx) { return sahelChart_(nq, toks, sahelLv_(nq, cx.L), rg); } },\n  { id: 'trial', group: 'حسابداری و دفاتر', title: 'تراز اشخاص و دفاتر', need: 'ledger', desc: 'مانده همهٔ اشخاص یا دفترها. «بدهکاران» یا «بستانکاران» فیلتر می‌کند؛ با «دفتر کل / دفتر معین» سطح دفتر عوض می‌شود.',\n    ex: ['تراز اشخاص', 'بدهکاران', 'تراز دفتر کل', 'تراز دفتر معین'], test: /تراز|بدهکاران|بستانکاران|لیست مانده/, run: function (nq, toks, rg, cx) { return sahelTrial_(nq, sahelLv_(nq, cx.L)); } },\n  { id: 'statement', group: 'حسابداری و دفاتر', title: 'صورت‌حساب شخص یا دفتر', need: 'ledger', desc: 'ریز تراکنش‌ها با مانده تجمعی و ترتیب تاریخ. نام ناقص یا غلط‌املایی هم کار می‌کند و حساب‌های مشابه را پیشنهاد می‌دهم. با بازه، «مانده از قبل» هم محاسبه می‌شود.',\n    ex: ['حساب علی', 'حساب علی از اول مهر', 'دفتر کل بدهی', 'دفتر معین حساب پرداختنی'], test: /حساب|صورتحساب|گردش|مانده|دفتر|دفاتر/, run: function (nq, toks, rg, cx) { return sahelStatement_(toks, sahelLv_(nq, cx.L), rg); } },\n  { id: 'kardex', group: 'حسابداری و دفاتر', title: 'کاردکس و موجودی کالا', need: 'kardex', desc: 'موجودی و ارزش تقریبی کالا همراه اسناد مرتبط.',\n    ex: ['کاردکس رزین'], test: /کاردکس|موجودی|انبار/, run: function (nq, toks, rg, cx) { return sahelKardex_(toks, cx.L); } },\n  { id: 'period', group: 'حسابداری و دفاتر', title: 'خلاصهٔ اسناد در یک بازه', need: 'ledger', desc: 'تعداد و جمع اسناد؛ کلمهٔ فروش، خرید، دریافت، پرداخت یا تنخواه فقط همان شرح‌ها را می‌شمارد. بازه: امروز، دیروز، این هفته، ماه قبل، نام ماه، امسال، یا «از ۱۴۰۵/۰۵/۰۱ تا ۱۴۰۵/۰۷/۳۰».',\n    ex: ['خلاصه امروز', 'خلاصه فروش این هفته', 'خرید مهر', 'خلاصه ماه قبل'], test: function (nq, toks, rg) { return !!rg || /خلاصه|فروش|خرید|دریافت|پرداخت|گزارش|اسناد/.test(nq); }, run: function (nq, toks, rg, cx) { return sahelPeriod_(nq, cx.L, rg); } }\n];\n\n\n\n/** مسیریاب: به ترتیب فهرست دستورها می‌گردد؛ اولین دستوری که نتیجه بدهد برنده است */\n\n\n\n/* ═══ v0.6: پاک‌سازی دادهٔ تزئینی، نام‌های مشابه، پیوند شناور↔دفتر، هزینهٔ هوشمند، دامنهٔ شیت، فهرست پیشنهاد ═══ */\nfunction sahelClean_(v) {\n  v = String(v == null ? '' : v);\n  if (/^[*$#]/.test(v) || /[*$#]$/.test(v)) v = v.replace(/^[*$#\\s]+|[*$#\\s]+$/g, '');\n  var m = v.match(/^([\\d,.\\s]+)\\s*(rial|ریال|ريال)$/i);\n  return m ? m[1].trim() : v;\n}\n\nfunction sahelByDate_(i) { return function (a, b) { var x = sahelPad_(a[i]), y = sahelPad_(b[i]); return x \u003c y ? -1 : x > y ? 1 : 0; }; }\n\n/* ─── تطبیق تقریبی نام‌ها ─── */\nfunction sahelLev_(a, b, max) {\n  if (Math.abs(a.length - b.length) > max) return max + 1;\n  var p = [], i, j; for (j = 0; j \u003c= b.length; j++) p[j] = j;\n  for (i = 1; i \u003c= a.length; i++) {\n    var c = [i], mn = i;\n    for (j = 1; j \u003c= b.length; j++) { c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (c[j] \u003c mn) mn = c[j]; }\n    if (mn > max) return max + 1; p = c;\n  }\n  return p[b.length];\n}\nfunction sahelTokHit_(t, words, nn) {   // ۲ = دقیق یا زیررشته، ۱ = تقریبی (غلط املایی)، ۰ = ندارد\n  if (/^\\d+$/.test(t)) return words.indexOf(t) > -1 ? 2 : 0;\n  if (nn.indexOf(t) > -1) return 2;\n  if (t.length >= 4) { var mx = t.length >= 7 ? 2 : 1; for (var i = 0; i \u003c words.length; i++) if (words[i].length >= 3 && sahelLev_(t, words[i], mx) \u003c= mx) return 1; }\n  return 0;\n}\nfunction sahelCands_(toks, rows, idx, max) {\n  if (idx \u003c 0 || !toks.length) return [];\n  var seen = {}, out = [];\n  rows.forEach(function (r) {\n    var n = r[idx]; if (!n) return;\n    var e = seen[n]; if (e) { e.rows++; return; }\n    var nn = sahelNorm_(n), words = nn.split(' '), sc = 0, ex = 0;\n    toks.forEach(function (t) { var h = sahelTokHit_(t, words, nn); if (h) { sc++; if (h === 2) ex++; } });\n    e = seen[n] = { n: n, rows: 1, sc: sc, ex: ex, len: words.length, cov: sc / toks.length };\n    if (e.cov >= 0.5) out.push(e);\n  });\n  return out.sort(function (a, b) { return b.cov - a.cov || b.ex - a.ex || a.len - b.len || b.rows - a.rows; }).slice(0, max || 8);\n}\nfunction sahelNameToks_(s) { return sahelNorm_(s).split(' ').filter(function (t) { return t.length > 1 && !/^(آقای|اقای|خانم)$/.test(t); }); }\nfunction sahelSameName_(a, b) {   // ۲ = هم‌اندازه، ۱ = نام کوتاه‌تر درون نام بلندتر\n  var x = sahelNameToks_(a), y = sahelNameToks_(b); if (!x.length || !y.length) return 0;\n  if (x.length > y.length) { var t = x; x = y; y = t; }\n  var ny = y.join(' ');\n  return x.every(function (w) { return sahelTokHit_(w, y, ny) > 0; }) ? (x.length === y.length ? 2 : 1) : 0;\n}\nfunction sahelPartyOf_(owner, L) {\n  if (!L || L.p \u003c 0) return null;\n  var cnt = {}; L.sh.rows.forEach(function (r) { if (r[L.p]) cnt[r[L.p]] = (cnt[r[L.p]] || 0) + 1; });\n  var m = Object.keys(cnt).map(function (n) { return { n: n, s: sahelSameName_(owner, n), c: cnt[n] }; }).filter(function (x) { return x.s; }).sort(function (a, b) { return b.s - a.s || b.c - a.c; });\n  if (!m.length) return null;\n  var nm = m[0].n, td = 0, tc = 0;\n  L.sh.rows.forEach(function (r) { if (r[L.p] === nm) { td += sahelNum_(r[L.d]); tc += sahelNum_(r[L.c]); } });\n  return { name: nm, td: td, tc: tc, bal: td - tc, others: m.slice(1, 4).map(function (x) { return x.n; }) };\n}\nfunction sahelVesselsOf_(party, V) {\n  var rows = V.sh.rows.filter(function (r) { return sahelSameName_(party, r[V.o]); });\n  if (!rows.length) return null;
