<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ساحل هوشمند</title><meta name="theme-color" content="#0F7C8C"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO=s180">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO=s64">
<style>
:root{--ink:#EAF6F8;--mut:#A9C9CF;--glass:rgba(255,255,255,.09);--gb:rgba(255,255,255,.18);--aqua:#2FD6CC;--sand:#F2D8A0}
html[data-t="1"]{--b1:#050B16;--b2:#0B2147;--b3:#143E86}html[data-t="2"]{--b1:#3B0F1C;--b2:#9B2D3A;--b3:#F08A4B}html[data-t="3"]{--b1:#052E1A;--b2:#14633A;--b3:#3BA66B}
html[data-t="4"]{--b1:#0E0A24;--b2:#2B1B6B;--b3:#6A4CE0}html[data-t="5"]{--b1:#0B0C0E;--b2:#1F2125;--b3:#4A4331}html[data-t="6"]{--b1:#0D0B2E;--b2:#1E1B5E;--b3:#4B47D8}.hint{margin:14px 0 0;color:var(--mut);font-size:12px}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(165deg,var(--b1,#052B35) 0%,var(--b2,#0A5666) 48%,var(--b3,#12898F) 100%) fixed;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
.g1{width:420px;height:420px;background:#17B8B0;top:-120px;left:-100px}.g2{width:380px;height:380px;background:#2B7BD6;bottom:-140px;right:-100px}
@media(prefers-reduced-motion:no-preference){.g1{animation:fl 14s ease-in-out infinite alternate}.g2{animation:fl 18s ease-in-out infinite alternate-reverse}}
@keyframes fl{to{transform:translate(40px,30px)}}
.wave{position:fixed;left:0;right:0;bottom:0;height:120px;opacity:.12;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:34px 18px 120px}
.hero{text-align:center;padding:26px 0 8px}
.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,#17B8B0,#0F7C8C);display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
h1{margin:0;font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:-.5px}
.tag{margin:10px auto 0;max-width:620px;color:var(--mut);font-size:clamp(14px,2.4vw,17px);line-height:2}
.proj{display:inline-block;margin-top:12px;padding:3px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--gb);font-size:12.5px;color:var(--sand)}
.bar{margin:26px auto 0;max-width:680px;display:flex;gap:8px;background:var(--glass);border:1px solid var(--gb);border-radius:20px;padding:8px;backdrop-filter:blur(14px)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:16px Vazirmatn,Tahoma;padding:10px 14px}.bar input::placeholder{color:#9DC3C9}
.bar button{border:0;border-radius:14px;padding:0 24px;font:800 15px Vazirmatn,Tahoma;color:#052B35;background:linear-gradient(135deg,#7DF3E8,#2FD6CC);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button,.ex button{border:1px solid var(--gb);background:var(--glass);color:var(--ink);border-radius:18px;padding:6px 14px;font:600 12.5px Vazirmatn,Tahoma;cursor:pointer}
.chips button:hover,.ex button:hover{background:rgba(47,214,204,.22);border-color:var(--aqua)}
h2{font-size:18px;margin:44px 0 14px;font-weight:800;display:flex;align-items:center;gap:10px}h2:after{content:"";flex:1;height:1px;background:var(--gb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--glass);border:1px solid var(--gb);border-radius:20px;padding:16px;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:8px}
.card .gr{font-size:11.5px;color:var(--aqua);font-weight:600}.card b{font-size:15px}.card p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.sk{height:150px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 70%);background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){.sk{animation:sh 1.4s infinite}}@keyframes sh{to{background-position:-200% 0}}
.ad{position:relative;background:linear-gradient(135deg,rgba(242,216,160,.16),rgba(47,214,204,.12));border-color:rgba(242,216,160,.45)}
.ad i{position:absolute;top:12px;left:14px;font-style:normal;font-size:10.5px;color:var(--sand);border:1px solid rgba(242,216,160,.5);border-radius:10px;padding:0 8px}
.ad a{align-self:flex-start;margin-top:auto;text-decoration:none;color:#052B35;background:var(--sand);border-radius:12px;padding:6px 16px;font-weight:800;font-size:12.5px}
footer{margin-top:54px;text-align:center}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.soc a{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--gb);color:#fff;transition:.2s}
.soc a:hover{transform:translateY(-3px);background:rgba(47,214,204,.28)}
.fl{margin-top:16px;color:var(--mut);font-size:12.5px;line-height:2}.fl a{color:var(--sand);text-decoration:none;font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<svg class="wave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#fff" d="M0 60c150-50 300 50 450 0s300-50 450 0 220 30 300 0v60H0z"/></svg>
<main class="wrap">
  <section class="hero">
    <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M7 9a5 5 0 0 1 10 0"/></svg></div>
    <h1 id="bn">ساحل هوشمند</h1><p class="tag" id="bt"></p><span class="proj" id="bp" hidden></span>
    <form class="bar" id="bar" onsubmit="return false"><input id="bq" placeholder="مثلاً: حساب علی، شناور رضا، هزینه پروژه 51…" autocomplete="off" aria-label="سؤال"><button id="bg">بپرس</button></form>
    <div class="chips" id="chips"></div>
    <p class="hint">F2 یا / ← گفتگو · Alt+T ← تغییر تم · Alt+V ← میکروفون · # ← اتصال به یک شیت</p>
  </section>
  <h2>از کجا شروع کنم؟</h2>
  <section class="grid" id="cards"><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>
  <section id="adsec" hidden><h2>پیشنهادها</h2><div class="grid" id="ads"></div></section>
  <footer><div class="soc" id="soc"></div><div class="fl" id="fl"></div></footer>
</main>

<script>
(function(){
  var Q=new URLSearchParams(location.search),LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
  var API=Q.get('api')||LS('sai_api')||'https://script.google.com/macros/s/AKfycbxv1PPj_QyX5O4qD5aWGYTJgp1m-EyyVZxV9C-mRIsKGDwEcLV8cEOB5l4Im3iCVPHMrA/exec',KEY=Q.get('key')||LS('sai_key');
  if(!/^https:\/\//.test(API)){API=prompt('آدرس وب‌اپ Apps Script (Web app URL) را وارد کن:')||''}
  if(!KEY){KEY=prompt('کلید دسترسی را وارد کن:')||''}
  LS('sai_api',API);LS('sai_key',KEY);
  if((Q.get('key')||Q.get('api'))&&history.replaceState){var keep=Q.get('app')?'?app=1':'';history.replaceState(null,'',location.pathname+keep)}   // کلید از نوار آدرس پاک می‌شود

  function idb(){return new Promise(function(res,rej){var r=indexedDB.open('sahel',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function idbGet(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('k').objectStore('k').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
  function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=function(){res()};tx.onerror=function(){res()};tx.onabort=function(){res()}})}).catch(function(){})}
  var BOOT=null,started=false;
  function fetchBoot(force){return fetch(API+(API.indexOf('?')>-1?'&':'?')+'action=boot&key='+encodeURIComponent(KEY)+(force?'&force=1':'')).then(function(r){return r.json()}).then(function(b){if(b.error)throw new Error('unauthorized');b.cfg.ai=false;return b})}

  /* پل google.script.run برای ویجتی که از سرور آمده */
  var H={sahelData:function(f){if(!f&&BOOT)return Promise.resolve(JSON.stringify(BOOT.data));return fetchBoot(!!f).then(function(b){BOOT=b;idbSet('boot',{key:KEY,b:b});return JSON.stringify(b.data)}).catch(function(){return BOOT?JSON.stringify(BOOT.data):Promise.reject(new Error('آفلاین و بدون داده‌ی ذخیره‌شده'))})},
    sahelDataZ:function(){return Promise.reject(new Error('z'))},   // ویجت خودش به sahelData برمی‌گردد
    sahelRates:function(){return BOOT&&BOOT.rates||null},sahelNews:function(){return BOOT&&BOOT.news||[]},
    sahelClearCache:function(){BOOT=null;return idbSet('boot',null).then(function(){return 'ok'})},
    sahelClearAll:function(withBrain){BOOT=null;if(withBrain){LS('sai_alias','{}')}return idbSet('boot',null).then(function(){return 'ok'})},
    sahelBrain:function(){return{alias:JSON.parse(LS('sai_alias')||'{}'),chips:[]}},sahelLearn:function(){},
    sahelLearnAlias:function(f,t){var m=JSON.parse(LS('sai_alias')||'{}');m[f]=t;LS('sai_alias',JSON.stringify(m))},
    sahelAsk:function(){return{text:'گفتگوی هوشمند (Claude) فقط در نسخهٔ اصلی Apps Script فعال است؛ گزارش‌ها و جستجو اینجا کامل و آفلاین هم کار می‌کنند.'}},
    sahelRunAction:function(){return{text:'این کار فقط در نسخهٔ اصلی در دسترس است.'}}};
  function mk(ok,fail){return new Proxy({},{get:function(t,n){if(n==='withSuccessHandler')return function(f){return mk(f,fail)};if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var a=arguments;Promise.resolve().then(function(){return H[n]?H[n].apply(null,a):null}).then(function(r){ok&&ok(r)},function(e){fail&&fail(e)})}}})}
  window.google={script:{run:mk()}};

  /* ظاهر و موتور از سرور می‌آید: HTML را در صفحه می‌گذارد و اسکریپت‌ها را به ترتیب اجرا می‌کند */
  function mount(html){
    var host=document.createElement('div');host.innerHTML=html;
    var sc=[].slice.call(host.querySelectorAll('script'));sc.forEach(function(s){s.parentNode.removeChild(s)});
    while(host.firstChild)document.body.appendChild(host.firstChild);
    sc.forEach(function(s){var n=document.createElement('script');n.text=s.text;document.body.appendChild(n)});
  }
  function start(b){
    if(started)return;started=true;window.__BOOT=b;
    if(!b.app){showErr(new Error('noapp'));return}
    mount(b.app);runIndex();
  }
  function showErr(e){
    var msg=e.message==='unauthorized'?'آدرس یا کلید درست نیست (یا لینک منقضی شده)':e.message==='noapp'?'این دیپلوی Apps Script هنوز نسخهٔ جدید سرور را ندارد (آدرس تمام‌شونده به …'+API.slice(-8)+'). در Apps Script: Deploy ← Manage deployments ← مداد ← Version: New version ← Deploy':(e.message||e);
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:20px;display:grid;place-items:center;font:16px/2 Tahoma;direction:rtl;color:#fff;background:#0A5666;border-radius:16px;padding:24px;text-align:center;z-index:999999';
    d.innerHTML='<div>نتوانستم برنامه را بالا بیاورم:<br><b>'+msg+'</b><br><br><button style="padding:8px 18px;border-radius:10px;border:0;font:700 14px Tahoma">ورود دوباره</button></div>';
    d.querySelector('button').onclick=function(){LS('sai_api','');LS('sai_key','');idbSet('boot',null).then(function(){location.reload()})};document.body.appendChild(d)}

  idbGet('boot').then(function(c){
    var cached=c&&c.key===KEY&&c.b&&c.b.app?c.b:null;   // کش بدون «app» (نسخهٔ قدیمی پوسته) نادیده گرفته می‌شود
    if(cached){BOOT=cached;start(cached)}               // شروع آنی از کش
    var sig=function(x){return x?x.app+JSON.stringify([x.brand,x.cfg]):''};
    fetchBoot(false).then(function(b){
      var changed=started&&cached&&sig(b)!==sig(cached);
      BOOT=b;
      return idbSet('boot',{key:KEY,b:b}).then(function(){
        if(!started)start(b);
        else if(changed&&sessionStorage.getItem('sai_rl')!==String(sig(b).length)){sessionStorage.setItem('sai_rl',String(sig(b).length));location.reload()}   // نسخهٔ جدید آمد: یک‌بار خودکار رفرش
        else document.dispatchEvent(new Event('sai-fresh'));
      });
    }).catch(function(e){
      if(e.message==='unauthorized'){idbSet('boot',null).then(function(){if(started)location.reload();else showErr(e)})}
      else if(!started)showErr(e);
    });
  });

  if('serviceWorker' in navigator&&location.protocol==='https:'){
    var hadSW=!!navigator.serviceWorker.controller,rl=false;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
      reg.update();
      document.addEventListener('visibilitychange',function(){if(!document.hidden)reg.update()});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadSW||rl)return;rl=true;location.reload()});
  }

  /* صفحهٔ اصلی (hero) */
  function runIndex(){
    var B=window.__BOOT.brand,$=function(i){return document.getElementById(i)},esc=function(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML};
    setTimeout(function(){var im=new Image();im.alt='';im.width=60;im.height=60;im.style.cssText='border-radius:16px;display:block';im.onload=function(){var l=document.querySelector('.logo');l.innerHTML='';l.appendChild(im)};im.src='https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO=s128'},900);
    $('bn').textContent=B.name;$('bt').textContent=B.tagline;if(B.project){$('bp').textContent=B.project;$('bp').hidden=false}
    var IC={wa:'<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.6-1.6l.8-1-1-2z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
      ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/>',yt:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
      web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'};
    var LB={wa:'واتساپ',mail:'ایمیل',ig:'اینستاگرام',yt:'یوتیوب',web:'وب‌سایت',phone:'تماس'};
    $('soc').innerHTML=Object.keys(B.social||{}).map(function(k){return IC[k]?'<a href="'+esc(B.social[k])+'" target="_blank" rel="noopener" title="'+LB[k]+'" aria-label="'+LB[k]+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg></a>':''}).join('');
    $('fl').innerHTML=(B.phoneText?'پشتیبانی: <a href="'+esc((B.social||{}).phone||'#')+'">'+esc(B.phoneText)+'</a> · ':'')+'© '+esc(B.name)+' · نسخه '+esc(B.version)+' · اتصال: <span dir="ltr">…'+esc(API.slice(-6))+'</span>';
    if((B.ads||[]).length){$('adsec').hidden=false;$('ads').innerHTML=B.ads.map(function(a){return'<div class="card ad"><i>تبلیغ</i><b>'+esc(a.title)+'</b><p>'+esc(a.text)+'</p>'+(a.link?'<a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.cta||'بیشتر')+'</a>':'')+'</div>'}).join('')}
    function go(q){q=(q||'').trim();if(q&&window.sahelAskGlobal)window.sahelAskGlobal(q)}
    $('bg').onclick=function(){go($('bq').value);$('bq').value=''};
    $('bq').addEventListener('keydown',function(e){if(e.key==='Enter'){go(this.value);this.value=''}});
    function build(){
      if(typeof SAHEL_CMDS==='undefined'||typeof sahelHave_!=='function')return;
      var items=SAHEL_CMDS.concat(SAHEL.extra||[]).filter(function(c){return c.ex&&sahelHave_(c.need)&&c.id!=='brain'&&c.id!=='scope'});
      $('cards').innerHTML=items.slice(0,9).map(function(c){var ex=(c.exFn?c.exFn():c.ex).slice(0,3);
        return'<div class="card"><span class="gr">'+esc(c.group)+'</span><b>'+esc(c.title)+'</b><p>'+esc(c.desc)+'</p><div class="ex">'+ex.map(function(e){return'<button data-q="'+esc(e).replace(/"/g,'&quot;')+'">'+esc(e)+'</button>'}).join('')+'</div></div>'}).join('');
      var pick=[];items.forEach(function(c){if(['help','datetime','refresh','diagnose','selftest','export'].indexOf(c.id)<0&&pick.length<6)pick.push((c.exFn?c.exFn():c.ex)[0])});
      $('chips').innerHTML=['راهنما'].concat(pick).map(function(e){return'<button data-q="'+esc(e).replace(/"/g,'&quot;')+'">'+esc(e)+'</button>'}).join('');
    }
    document.addEventListener('click',function(e){var b=e.target.closest('#cards button[data-q],#chips button[data-q]');if(b)go(b.getAttribute('data-q'))});
    document.addEventListener('sahel-ready',build);
    if(typeof sahelSheets_==='function'&&sahelSheets_().length)build();
  }
})();
</script>
</body>
</html>
