<style>

urn amt; }\n    it.forEach(function (x) {\n      var a = Math.abs(x.v); if (!a) return;\n      if ((x.v > 0 ? 1 : -1) === sg) { a = eat(opp, a); if (a > 0) main.push({ n: x.n, v: a }); }\n      else { a = eat(main, a); if (a > 0) opp.push({ n: x.n, v: a }); }\n    });\n    var b = [0, 0, 0, 0];\n    main.forEach(function (x) { var age = now - x.n; b[age \u003c= 30 ? 0 : age \u003c= 60 ? 1 : age \u003c= 90 ? 2 : 3] += x.v; });\n    var tot = b[0] + b[1] + b[2] + b[3]; if (!tot) return;\n    over += b[3]; if (sg > 0) rec += tot; else pay += tot;\n    out.push({ p: p, st: sg > 0 ? 'بدهکار' : 'بستانکار', b: b, t: tot });\n  });\n  out.sort(function (a, b) { return b.t - a.t; });\n  if (!out.length) return { text: 'مانده‌ای برای بررسی معوقات پیدا نشد.', found: [] };\n  return { text: 'معوقات: مطالبات ' + sahelFmt_(rec) + '، بدهی‌ها ' + sahelFmt_(pay) + '، بیش از ۹۰ روز ' + sahelFmt_(over) + '. سن هر سند از تاریخ ثبت آن حساب شده (نه تاریخ سررسید) و تبدیل به نرخ روز ندارد.',\n    found: [{ sheet: 'سن مانده اشخاص', head: ['نام', 'وضعیت', '۰ تا ۳۰ روز', '۳۱ تا ۶۰ روز', '۶۱ تا ۹۰ روز', 'بیش از ۹۰ روز', 'جمع مانده'], count: out.length,\n      rows: out.slice(0, 500).map(function (x) { return [x.p, x.st, sahelFmt_(x.b[0]), sahelFmt_(x.b[1]), sahelFmt_(x.b[2]), sahelFmt_(x.b[3]), sahelFmt_(x.t)]; }),\n      totals: { 'مطالبات': rec, 'بدهی‌ها': pay, 'بیش از ۹۰ روز': over } }] };\n}\n\nfunction sahelCompare_(D) {\n  if (D.dt \u003c 0) return null;\n  var t = sahelDayIso_(0), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)), p2 = function (n) { return ('0' + n).slice(-2); };\n  var py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;\n  var cur = { from: y + '/' + p2(m) + '/01', to: t }, prev = { from: py + '/' + p2(pm) + '/01', to: py + '/' + p2(pm) + '/31' };\n  function sum(rg) { var a = [0, 0, 0]; D.sh.rows.forEach(function (r) { if (sahelInRange_(r[D.dt], rg)) { a[0] += sahelNumD_(r, D); a[1] += sahelNumC_(r, D); a[2]++; } }); return a; }\n  var a = sum(prev), b = sum(cur);\n  var pct = function (x, y) { return x ? (y - x) / x * 100 : 0; };\n  var ch = function (x, y) { return x ? (pct(x, y) > 0 ? '+' : '') + Math.round(pct(x, y)) + '٪' : '—'; };\n  var rows = [['بدهکار', sahelFmt_(a[0]), sahelFmt_(b[0]), ch(a[0], b[0])], ['بستانکار', sahelFmt_(a[1]), sahelFmt_(b[1]), ch(a[1], b[1])], ['تعداد سند', String(a[2]), String(b[2]), ch(a[2], b[2])]];\n  return { text: 'مقایسهٔ این ماه با ماه قبل: بدهکار ' + ch(a[0], b[0]) + '، بستانکار ' + ch(a[1], b[1]) + '، تعداد سند ' + ch(a[2], b[2]) + '.',\n    found: [{ sheet: 'مقایسهٔ ماهانه', head: ['شاخص', 'ماه قبل', 'این ماه', 'تغییر'], count: 3, rows: rows, totals: { 'بدهکار این ماه': b[0], 'بستانکار این ماه': b[1] } }] };\n}\n\n/* ═══ لایهٔ دادهٔ حافظه‌ای، تاریخ شمسی، نقش شیت‌ها، ثبت دستورها و راهنمای خودکار ═══ */\nvar SAHEL = { snap: null, cfg: {}, memo: {}, extra: [] };\nfunction sahelConfig_() { return SAHEL.cfg || {}; }\nfunction sahelSheets_() { return SAHEL.snap ? SAHEL.snap.sheets : []; }\n\n\nvar SAHEL_WD_ = { Saturday: 0, Sunday: 1, Monday: 2, Tuesday: 3, Wednesday: 4, Thursday: 5, Friday: 6 };\nvar SAHEL_WDN_ = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];\nfunction sahelJalali_(d) {\n  var p = {};\n  new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hourCycle: 'h23', weekday: 'long' })\n    .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });\n  var jy = Number(p.year), jm = Number(p.month), jd = Number(p.day);\n  return { text: SAHEL_WDN_[SAHEL_WD_[p.weekday]] + ' ' + jd + ' ' + SAHEL_MONTHS_[jm - 1] + ' ' + jy, time: Number(p.hour) + ':' + p.minute, iso: jy + '/' + jm + '/' + jd };\n}\nfunction sahelWeekday_(d) { return SAHEL_WD_[new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tehran', weekday: 'long' }).format(d)]; }\n\n/* ─── نقش شیت‌ها: دفتر حساب، شناورها، هزینهٔ پروژه ─── */\nfunction sahelRole_(role) {\n  if (SAHEL.memo ahelRole_('ledger'), C = sahelRole_('costs');\n  function t(n, c, e) { if (c) ok++; else bad++; rows.push([n, c ? '✅ درست' : '❌ ' + (e || '')]); }\n  if (L && L.p > -1) {\n    var by = {}, sd = 0, sc = 0;\n    L.sh.rows.forEach(function (r) { var d = sahelNum_(r[L.d]), c = sahelNum_(r[L.c]); sd += d; sc += c; var p = r[L.p]; if (!p) return; by[p] = by[p] || [0, 0]; by[p][0] += d; by[p][1] += c; });\n    Object.keys(by).slice(0, 25).forEach(function (p) { var s = sahelStatement_(sahelNorm_(p).split(' '), L), f = s && s.found[0]; t('صورت‌حساب ' + p, !!f && f.totals['بدهکار'] === by[p][0] && f.totals['بستانکار'] === by[p][1], f ? 'اختلاف' : 'پیدا نشد'); });\n    var tr = sahelTrial_('تراز', L).found[0].totals;\n    t('تراز اشخاص با جمع کل می‌خواند', Math.abs((tr['مانده بدهکار'] - tr['مانده بستانکار']) - (sd - sc)) \u003c 1, 'اختلاف');\n  }\n  if (C) t('جمع پروژه‌ها = جمع کل هزینه‌ها', Math.abs(sahelGroup_(C.sh.rows, C.p, C.a, 1e6).reduce(function (a, x) { return a + x.v; }, 0) - sahelSum_(C.sh.rows, C.a)) \u003c 1, 'اختلاف');\n  t('نرمال‌سازی ارقام و ی/ک', sahelNorm_('۲۵۱۴ كريم') === '2514 کریم', sahelNorm_('۲۵۱۴ كريم'));\n  return { text: 'تست دقت: ' + ok + ' درست، ' + bad + ' ناموفق.', found: [{ sheet: 'نتیجهٔ تست دقت', head: ['آزمون', 'نتیجه'], count: rows.length, rows: rows.slice(0, 40), totals: {} }] };\n}\n\n/* ═══ ثبت دستورها: تنها منبع حقیقت؛ مسیریاب و راهنما هر دو از همین فهرست ساخته می‌شوند ═══\n * برای افزودن دستور جدید یک آیتم به SAHEL_CMDS اضافه کن: { id, group, title, desc, ex:[مثال‌ها], need, test:/regex/, run:function(nq,toks,rg,cx){} }\n * need: 'ledger' | 'vessels' | 'costs' | 'kardex' | بدون need = همیشه فعال. راهنما خودکار به‌روز می‌شود. */\nvar SAHEL_CMDS = [\n  { id: 'help', group: 'عمومی', title: 'راهنمای دستورها', desc: 'فهرست همهٔ دستورهای فعال برای شیت‌های متصل. بعد از «راهنما» یک کلمه بنویس تا فقط همان بخش را ببینی.', ex: ['راهنما', 'راهنما شناور', 'راهنما هزینه'],\n    test: /راهنما|دستورات|دستور ها|\\bhelp\\b/, run: function (nq) { return sahelHelp_(nq); } },\n  { id: 'datetime', group: 'عمومی', title: 'تاریخ و ساعت', desc: 'تاریخ شمسی و ساعت تهران.', ex: ['تاریخ و ساعت'],\n    test: /ساعت چند|چندمه|چه روزی|تاریخ امروز|تاریخ و ساعت|الان چه/, run: function () { var j = sahelJalali_(new Date()); return { text: 'امروز ' + j.text + '، ساعت ' + j.time + ' (به وقت تهران).', found: [] }; } },\n  { id: 'refresh', group: 'عمومی', title: 'بروزرسانی داده', desc: 'داده‌ها را دوباره از گوگل‌شیت می‌خواند. اگر شیت را تازه تغییر داده‌ای بزن.', ex: ['بروزرسانی داده'],\n    test: /بروزرسانی|به روزرسانی|ریفرش|داده جدید/, run: function () { return { text: 'در حال بروزرسانی داده‌ها از شیت…', found: [], refresh: true }; } },\n  { id: 'diagnose', group: 'عمومی', title: 'تشخیص ستون‌ها', desc: 'نشان می‌دهد هر شیت چه نقشی گرفته و کدام ستون‌ها شناسایی شده‌اند.', ex: ['تشخیص ستون‌ها'],\n    test: /تشخیص ستون|ستون ها/, run: function () { return sahelDiagnose_(); } },\n  { id: 'selftest', group: 'عمومی', title: 'تست دقت', desc: 'جمع‌های گزارش‌ها را با یک محاسبهٔ مستقل از خود شیت مقایسه می‌کند.', ex: ['تست دقت'],\n    test: /تست دقت|بررسی دقت/, run: function () { return sahelSelfTest_(); } },\n\n  { id: 'scope', group: 'عمومی', title: 'محدود کردن به یک شیت', desc: 'اسم شیت را داخل سؤال بنویس تا فقط از همان شیت جواب بدهم. اگر فقط اسم شیت را بنویسی، خلاصه و چند ردیف اولش را می‌بینی.',\n    exFn: function () { return sahelSheets_().slice(0, 3).map(function (s, i) { return i === 1 ? s.title + ' علی' : s.title; }); }, ex: ['x'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'export', group: 'عمومی', title: 'ذخیره PDF و چاپ جدول', desc: 'بعد از هر گزارش بگو «پی دی اف» یا دکمهٔ PDF بالای جدول را بزن: کاغذ A4 یا A5، عمودی یا افقی. در پنجرهٔ باز‌شده Save as PDF یا چاپ را انتخاب کن.',\n    ex: ['پی دی اف', 'چاپ جدول'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'brain', group: 'عمومی', title: 'ادامهٔ گفتگو و یادگیری', desc: 'بعد از یک گزارش می‌توانی فقط بنویسی «مهر ماه» یا «نمودارش». نام‌های مشابه را پیشنهاد می‌کنم و انتخاب‌هایت را برای دفعهٔ بعد یاد می‌گیرم.',\n    ex: ['حساب علی', 'نمودارش', 'ماه قبل'], test: function () { return false; }, run: function () { return null; } },\n  { id: 'vessel', group: 'شناورها', title: 'مشخصات یا فهرست شناورها', need: 'vessels',\n    desc: 'نام مالک یا شمارهٔ ثبت موقت → کارت کامل شناور همراه بدهکاری، بستانکاری و مانده همان مالک در دفتر حسابداری. بدون نام → فهرست با فیلتر پیشرفت، بازهٔ تاریخ قرارداد، جمع قراردادها و نمودار.',\n    ex: ['شناور رضا', 'شماره ثبت 1234', 'پیشرفت شناورها', 'شناورهای تکمیل نشده', 'شناورهای بالای 50 درصد', 'قراردادهای این ماه', 'بدهکاری و بستانکاری شماره ثبت 1234'],\n    test: /شناور|مالک|ثبت موقت|شماره ثبت|متراژ|تماس|پیشرفت|قرارداد|تکمیل|آدرس/, run: function (nq, toks, rg, cx) { return sahelVessel_(nq, toks, rg, cx.V); } },\n\n  { id: 'costs', group: 'هزینهٔ پروژه و تنخواه', title: 'هزینهٔ پروژه، تنخواه و دسته‌بندی', need: 'costs',\n    desc: 'با نام پروژه یا تنخواه: ریز اسناد و تفکیک عنوان هزینه. بدون نام: مقایسهٔ پروژه‌ها، تنخواه‌ها یا دسته‌ها؛ با «بزرگ‌ترین» ده هزینهٔ بزرگ؛ با «نمودار» روند ماهانه. همه با بازهٔ تاریخ کار می‌کنند؛ می‌توانی دریافت‌کننده یا کلیدواژه هم بگویی (مثلاً «به علی احمدی» یا «میلگرد») و آخر هر جدول «جمع کل» هست.',\n    ex: ['هزینه پروژه‌ها', 'هزینه پروژه الف', 'تنخواه‌ها', 'تنخواه علی این ماه', 'هزینه بر اساس عنوان هزینه', 'بزرگ‌ترین هزینه‌ها', 'نمودار هزینه ماهانه', 'پروژه 51 مریم به علی احمدی چقدر واریز کردیم', 'پروژه 51 مریم چقدر برای خرید میلگرد هزینه کردیم'],\n    test: SAHEL_COSTW_, run: function (nq, toks, rg, cx) { return sahelCostReport_(nq, toks, rg, cx.C); } },\n\n  { id: 'pnl', group: 'گزارش مالی', title: 'سود و زیان و مالیات', need: 'ledger', desc: 'درآمد و هزینه از روی نام «دفتر کل»؛ با بازه هم کار می‌کند. «مالیات» با taxRate تنظیم‌شده محاسبه می‌شود.',\n    ex: ['سود و زیان', 'سود و زیان مهر', 'مالیات امسال'], test: /سود|زیان|مالیات/, run: function (nq, toks, rg, cx) { return sahelPnl_(nq, cx.L, rg, /مالیات/.test(nq)); } },\n  { id: 'aging', group: 'گزارش مالی', title: 'معوقات (سن مانده اشخاص)', need: 'ledger', desc: 'مانده هر شخص بر اساس سن اسناد: تا ۳۰، ۳۱ تا ۶۰، ۶۱ تا ۹۰ و بیش از ۹۰ روز.',\n    ex: ['معوقات'], test: /معوق|سن بدهی|سررسید/, run: function (nq, toks, rg, cx) { return sahelAging_(cx.L); } },\n  { id: 'compare', group: 'گزارش مالی', title: 'مقایسهٔ ماه با ماه قبل', need: 'ledger', desc: 'بدهکار، بستانکار و تعداد سند این ماه در مقابل ماه قبل، با درصد تغییر.',\n    ex: ['مقایسه ماه'], test: function (nq) { return /مقایسه/.test(nq) && !SAHEL_COSTW_.test(nq); }, run: function (nq, toks, rg, cx) { return sahelCompare_(cx.L); } },\n  { id: 'chart', group: 'گزارش مالی', title: 'نمودار روند و اشخاص', need: 'ledger', desc: 'نمودار ماهانهٔ بدهکار و بستانکار؛ با نام شخص یا بازه محدودش کن. «نمودار اشخاص» مانده ۸ شخص اول را نشان می‌دهد.',\n    ex: ['نمودار روند', 'نمودار علی', 'نمودار اشخاص', 'نمودار روند مهر'], test: function (nq) { return /نمودار|چارت|روند/.test(nq) && !SAHEL_COSTW_.test(nq); }, run: function (nq, toks, rg, cx) { return sahelChart_(nq, toks, sahelLv_(nq, cx.L), rg); } },\n  { id: 'trial', group: 'حسابداری و دفاتر', title: 'تراز اشخاص و دفاتر', need: 'ledger', desc: 'مانده همهٔ اشخاص یا دفترها. «بدهکاران» یا «بستانکاران» فیلتر می‌کند؛ با «دفتر کل / دفتر معین» سطح دفتر عوض می‌شود.',\n    ex: ['تراز اشخاص', 'بدهکاران', 'تراز دفتر کل', 'تراز دفتر معین'], test: /تراز|بدهکاران|بستانکاران|لیست مانده/, run: function (nq, toks, rg, cx) { return sahelTrial_(nq, sahelLv_(nq, cx.L)); } },\n  { id: 'statement', group: 'حسابداری و دفاتر', title: 'صورت‌حساب شخص یا دفتر', need: 'ledger', desc: 'ریز تراکنش‌ها با مانده تجمعی و ترتیب تاریخ. نام ناقص یا غلط‌املایی هم کار می‌کند و حساب‌های مشابه را پیشنهاد می‌دهم. با بازه، «مانده از قبل» هم محاسبه می‌شود.',\n    ex: ['حساب علی', 'حساب علی از اول مهر', 'دفتر کل بدهی', 'دفتر معین حساب پرداختنی'], test: /حساب|صورتحساب|گردش|مانده|دفتر|دفاتر/, run: function (nq, toks, rg, cx) { return sahelStatement_(toks, sahelLv_(nq, cx.L), rg); } },\n  { id: 'kardex', group: 'حسابداری و دفاتر', title: 'کاردکس و موجودی کالا', need: 'kardex', desc: 'موجودی و ارزش تقریبی کالا همراه اسناد مرتبط.',\n    ex: ['کاردکس رزین'], test: /کاردکس|موجودی|انبار/, run: function (nq, toks, rg, cx) { return sahelKardex_(toks, cx.L); } },\n  { id: 'period', group: 'حسابداری و دفاتر', title: 'خلاصهٔ اسناد در یک بازه', need: 'ledger', desc: 'تعداد و جمع اسناد؛ کلمهٔ فروش، خرید، دریافت، پرداخت یا تنخواه فقط همان شرح‌ها را می‌شمارد. بازه: امروز، دیروز، این هفته، ماه قبل، نام ماه، امسال، یا «از ۱۴۰۵/۰۵/۰۱ تا ۱۴۰۵/۰۷/۳۰».',\n    ex: ['خلاصه امروز', 'خلاصه فروش این هفته', 'خرید مهر', 'خلاصه ماه قبل'], test: function (nq, toks, rg) { return !!rg || /خلاصه|فروش|خرید|دریافت|پرداخت|گزارش|اسناد/.test(nq); }, run: function (nq, toks, rg, cx) { return sahelPeriod_(nq, cx.L, rg); } }\n];\n\n\n\n/** مسیریاب: به ترتیب فهرست دستورها می‌گردد؛ اولین دستوری که نتیجه بدهد برنده است */\n\n\n\n/* ═══ v0.6: پاک‌سازی دادهٔ تزئینی، نام‌های مشابه، پیوند شناور↔دفتر، هزینهٔ هوشمند، دامنهٔ شیت، فهرست پیشنهاد ═══ */\nfunction sahelClean_(v) {\n  v = String(v == null ? '' : v);\n  if (/^[*$#]/.test(v) || /[*$#]$/.test(v)) v = v.replace(/^[*$#\\s]+|[*$#\\s]+$/g, '');\n  var m = v.match(/^([\\d,.\\s]+)\\s*(rial|ریال|ريال)$/i);\n  return m ? m[1].trim() : v;\n}\n\nfunction sahelByDate_(i) { return function (a, b) { var x = sahelPad_(a[i]), y = sahelPad_(b[i]); return x \u003c y ? -1 : x > y ? 1 : 0; }; }\n\n/* ─── تطبیق تقریبی نام‌ها ─── */\nfunction sahelLev_(a, b, max) {\n  if (Math.abs(a.length - b.length) > max) return max + 1;\n  var p = [], i, j; for (j = 0; j \u003c= b.length; j++) p[j] = j;\n  for (i = 1; i \u003c= a.length; i++) {\n    var c = [i], mn = i;\n    for (j = 1; j \u003c= b.length; j++) { c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (c[j] \u003c mn) mn = c[j]; }\n    if (mn > max) return max + 1; p = c;\n  }\n  return p[b.length];\n}\nfunction sahelTokHit_(t, words, nn) {   // ۲ = دقیق یا زیررشته، ۱ = تقریبی (غل خواه، مالکان شناور) و تفصیلی حساب هر شخص یا مورد (مثل «علی پاسلار»). جمع مانده تفصیلی‌ها = مانده معین و جمع معین‌ها = مانده کل. در ساحل اسم هر کدام را بنویسی همان سطح را باز می‌کنم.' },\n  { t: 'تراز', k: /تراز/, a: 'تراز جدولی از مانده همهٔ حساب‌هاست. در یک دفتر درست، جمع مانده‌های بدهکار با جمع مانده‌های بستانکار برابر می‌شود. اگر نشد، یعنی جایی سند یک‌طرفه یا اشتباه ثبت شده؛ «اسناد تکراری» و «تراز اشخاص» کمک می‌کنند.' },\n  { t: 'تنخواه', k: /تنخواه/, a: 'تنخواه مبلغی است که برای هزینه‌های جاری و کوچک در اختیار یک نفر گذاشته می‌شود. او هزینه می‌کند، سند و فاکتور می‌آورد و بعد تنخواهش «تسویه» یا شارژ می‌شود. «تنخواه نام» هزینه‌های آن شخص را از شیت هزینه‌ها می‌آورد.' },\n  { t: 'معوقات', k: /معوق|سررسید|تأخیر|تاخیر/, a: 'معوقات یعنی مانده‌هایی که مدتی بدون تسویه مانده‌اند. ساحل سن هر مانده را از تاریخ ثبت سند حساب می‌کند و در بازه‌های ۳۰، ۶۰، ۹۰ و بیشتر می‌گذارد؛ هر چه قدیمی‌تر، وصول سخت‌تر.' },\n  { t: 'سند حسابداری', k: /سند حسابداری|سند چیست/, a: 'سند حسابداری ثبت یک رویداد مالی است (پرداخت، دریافت، خرید…) با تاریخ، شرح، حساب‌های درگیر و مبلغ بدهکار و بستانکار. هر ردیف شیت «نمایش حسابداری» یک سطر از یک سند است.' },\n  { t: 'سود و زیان', k: /سود|زیان/, a: 'سود = درآمد − هزینه؛ اگر منفی شود «زیان» است. ساحل درآمد و هزینه را از نام دفتر کل تشخیص می‌دهد (قابل تنظیم با pnl) و اگر نرخ مالیات را در تنظیمات بدهی، سود پس از مالیات را هم می‌گوید. نرخ مالیات را از قانون جاری یا مشاور مالیاتی بگیر.' },\n  { t: 'پیش‌پرداخت و پرداخت بر اساس پیشرفت', k: /پیش ?پرداخت|اقساط|درصد پیشرفت|عقد|برنامه پرداخت/, a: 'قاعدهٔ شما: ۵۰٪ مبلغ هنگام عقد قرارداد و بقیه به نسبت درصد پیشرفت. مبلغ لازم تا امروز = مبلغ × (۵۰٪ + ۵۰٪ × درصد پیشرفت). اگر پرداخت‌شده از آن کمتر باشد، کسری دارد. «برنامه پرداخت» همین را برای همهٔ مالک‌ها حساب می‌کند.' },\n  { t: 'اثر نرخ ارز بر قرارداد', k: /نرخ ارز|ارز|دلار/, a: 'وقتی قرارداد ریالی است ولی هزینه‌ها (فولاد، موتور، قطعات) به ارز وابسته‌اند، با بالا رفتن نرخ ارز ارزش واقعی اقساط دریافتی کم می‌شود؛ هر چه پرداخت دیرتر برسد، ارزش دلاری‌اش کمتر است. ساحل مبلغ
